name: macOS packages

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The custom signer only uses ad-hoc signing; no signing secrets or
      # developer certificates are exposed to pull-request builds.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Package native DMG and ZIP
        run: npm run package:mac -- --${{ matrix.arch }}
      - name: Check archive hashes
        run: shasum -a 256 release/build/*.dmg release/build/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenelab-macos-${{ matrix.arch }}
          path: |
            release/build/*.dmg
            release/build/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify ${{ matrix.arch }} (${{ matrix.execution }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            execution: native
          - arch: x64
            runner: macos-15
            execution: rosetta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare Intel translation on the graphics-capable Mac
        if: matrix.execution == 'rosetta'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scenelab-macos-${{ matrix.arch }}
          path: release/build
      - name: Verify DMG, ZIP and packaged app startup
        env:
          SCENELAB_SMOKE_EXECUTION: ${{ matrix.execution }}
        run: node scripts/smoke-mac.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac-verification-${{ matrix.arch }}
          path: release/mac-verification
          if-no-files-found: warn
          retention-days: 14

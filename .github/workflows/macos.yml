name: macOS packages

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The custom signer only uses ad-hoc signing; no signing secrets or
      # developer certificates are exposed to pull-request builds.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Package native DMG and ZIP
        run: npm run package:mac -- --${{ matrix.arch }}
      - name: Check archive hashes
        run: shasum -a 256 release/build/*.dmg release/build/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenelab-macos-${{ matrix.arch }}
          path: |
            release/build/*.dmg
            release/build/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified macOS release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'deathunt1-blip/SceneLab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scenelab-macos-*
          merge-multiple: true
          path: release/build
      - name: Verify tag version and prepare attachments
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
          node scripts/prepare-mac-release.cjs
      - name: Create draft and upload attachments
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "SceneLab $RELEASE_TAG for macOS" --notes-file "docs/$RELEASE_TAG-更新说明.md"
          gh release upload "$RELEASE_TAG" release/mac-distribution/*
      - name: Verify every uploaded SHA-256 before publishing
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft == true) | .id')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release/mac-uploaded.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > release/mac-uploaded-assets.json
          node scripts/verify-mac-release.cjs
          gh release edit "$RELEASE_TAG" --draft=false --latest

  verify:
    name: Verify ${{ matrix.arch }} (${{ matrix.execution }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            execution: native
          - arch: x64
            runner: macos-15
            execution: rosetta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare Intel translation on the graphics-capable Mac
        if: matrix.execution == 'rosetta'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scenelab-macos-${{ matrix.arch }}
          path: release/build
      - name: Verify DMG, ZIP and packaged app startup
        env:
          SCENELAB_SMOKE_EXECUTION: ${{ matrix.execution }}
        run: node scripts/smoke-mac.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac-verification-${{ matrix.arch }}
          path: release/mac-verification
          if-no-files-found: warn
          retention-days: 14
